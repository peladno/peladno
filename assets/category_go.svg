<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-go" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b161b" />
      <stop offset="50%" stop-color="#0f2129" />
      <stop offset="100%" stop-color="#142b34" />
    </linearGradient>
    <linearGradient id="border-go" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2496ED" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="glow-go" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-go" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect x="2" y="2" width="846" height="146" rx="14" fill="url(#bg-go)" />
  <rect x="2" y="2" width="846" height="146" rx="14" fill="url(#grid-go)" />
  <rect x="2" y="2" width="846" height="146" rx="14" fill="url(#glow-go)" />
  <rect x="2" y="2" width="846" height="146" rx="14" fill="none" stroke="url(#border-go)" stroke-width="2" />

  <!-- Go Logo Box -->
  <g transform="translate(38, 42)">
    <rect width="66" height="66" rx="12" fill="#00ADD8"/>
    <text x="33" y="47" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle">GO</text>
  </g>

  <!-- Docker Box -->
  <g transform="translate(125, 42)">
    <rect width="66" height="66" rx="12" fill="#2496ED" fill-opacity="0.2" stroke="#2496ED" stroke-width="1.5"/>
    <text x="33" y="45" fill="#2496ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" text-anchor="middle">🐳</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="215" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="0.5">GO &amp; BACKEND SYSTEMS</text>
  <text x="215" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">Concurrent Programming • High Performance Services • Containers</text>

  <!-- Tags -->
  <g transform="translate(215, 102)">
    <rect x="0" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="37" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Golang</text>

    <rect x="85" y="0" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="120" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Docker</text>

    <rect x="165" y="0" width="85" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="207" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>

    <rect x="260" y="0" width="80" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="300" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">REST APIs</text>

    <rect x="350" y="0" width="75" height="22" rx="6" fill="#00ADD8" fill-opacity="0.3" stroke="#00ADD8" stroke-width="1"/>
    <text x="387" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Backend</text>
  </g>
</svg>