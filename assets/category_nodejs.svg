<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b140e" />
      <stop offset="50%" stop-color="#101d14" />
      <stop offset="100%" stop-color="#16291c" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68A063" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3C873A" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glow-node" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#68A063" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#68A063" stop-opacity="0" />
    </radialGradient>

    <!-- Pattern -->
    <pattern id="grid-node" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="846" height="146" rx="14" fill="url(#bg-node)" />
  <rect x="2" y="2" width="846" height="146" rx="14" fill="url(#grid-node)" />
  <rect x="2" y="2" width="846" height="146" rx="14" fill="url(#glow-node)" />
  <rect x="2" y="2" width="846" height="146" rx="14" fill="none" stroke="url(#border-node)" stroke-width="2" />

  <!-- Node.js Logo (Hexagon icon) -->
  <g transform="translate(42, 36)">
    <!-- Hexagon Outer -->
    <path d="M38 4 L68 21.5 L68 56.5 L38 74 L8 56.5 L8 21.5 Z" fill="#215732" stroke="#68A063" stroke-width="2.5" />
    <!-- Node 'N' mark stylized inside -->
    <path d="M25 51 L25 27 L33 27 L51 46 L51 27 L57 27 L57 51 L49 51 L31 32 L31 51 Z" fill="#39D353" />
  </g>

  <!-- Express mark box -->
  <g transform="translate(130, 41)">
    <rect width="66" height="66" rx="12" fill="#18181b" stroke="#334155" stroke-width="1.5"/>
    <text x="33" y="44" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">EXPRESS</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="220" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="0.5">NODE.JS &amp; BACKEND ARCHITECTURE</text>
  <text x="220" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">ESM Modules • RESTful APIs • Prisma ORM • Microservices &amp; Docker</text>

  <!-- Tags -->
  <g transform="translate(220, 102)">
    <rect x="0" y="0" width="85" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="42" y="15" fill="#4ade80" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Node.js (ESM)</text>

    <rect x="95" y="0" width="85" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="137" y="15" fill="#4ade80" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Express.js</text>

    <rect x="190" y="0" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="225" y="15" fill="#4ade80" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Prisma</text>

    <rect x="270" y="0" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="315" y="15" fill="#4ade80" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>

    <rect x="370" y="0" width="75" height="22" rx="6" fill="#68A063" fill-opacity="0.3" stroke="#68A063" stroke-width="1"/>
    <text x="407" y="15" fill="#86efac" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Backend</text>
  </g>
</svg>