<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-ts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="50%" stop-color="#101c2e" />
      <stop offset="100%" stop-color="#162033" />
    </linearGradient>
    <linearGradient id="border-ts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3178C6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#61DAFB" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="glow-ts" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3178C6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3178C6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-ts" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect x="2" y="2" width="846" height="146" rx="14" fill="url(#bg-ts)" />
  <rect x="2" y="2" width="846" height="146" rx="14" fill="url(#grid-ts)" />
  <rect x="2" y="2" width="846" height="146" rx="14" fill="url(#glow-ts)" />
  <rect x="2" y="2" width="846" height="146" rx="14" fill="none" stroke="url(#border-ts)" stroke-width="2" />

  <!-- TypeScript Logo Box -->
  <g transform="translate(38, 42)">
    <rect width="66" height="66" rx="12" fill="#3178C6"/>
    <text x="33" y="47" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle">TS</text>
  </g>

  <!-- React Icon -->
  <g transform="translate(125, 42)">
    <rect width="66" height="66" rx="12" fill="#20232A" stroke="#334155" stroke-width="1"/>
    <ellipse cx="33" cy="33" rx="8" ry="24" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(30 33 33)"/>
    <ellipse cx="33" cy="33" rx="8" ry="24" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(90 33 33)"/>
    <ellipse cx="33" cy="33" rx="8" ry="24" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(150 33 33)"/>
    <circle cx="33" cy="33" r="4" fill="#61DAFB"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="215" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="0.5">TYPESCRIPT &amp; WEB ECOSYSTEM</text>
  <text x="215" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">Full-Stack Web Development • Clean Architecture</text>

  <!-- Tags -->
  <g transform="translate(215, 102)">
    <rect x="0" y="0" width="85" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="42" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">React / Next</text>

    <rect x="95" y="0" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="130" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Node ESM</text>

    <rect x="175" y="0" width="65" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="207" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Prisma</text>

    <rect x="250" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="287" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Tailwind</text>

    <rect x="335" y="0" width="75" height="22" rx="6" fill="#3178C6" fill-opacity="0.3" stroke="#3178C6" stroke-width="1"/>
    <text x="372" y="15" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Fullstack</text>
  </g>
</svg>